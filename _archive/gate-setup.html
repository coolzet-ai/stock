<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>암호 해시 만들기</title>
<style>body{font-family:-apple-system,"Noto Sans KR",sans-serif;max-width:560px;margin:30px auto;padding:0 16px;line-height:1.6}input{width:100%;box-sizing:border-box;padding:10px;font-size:15px;margin:4px 0 12px;border:1px solid #bbb;border-radius:8px}button{padding:10px 18px;font-size:15px;font-weight:800;border:0;border-radius:8px;background:#00754a;color:#fff;cursor:pointer}pre{background:#f1f3f2;padding:12px;border-radius:8px;overflow:auto;font-size:12.5px;white-space:pre-wrap;word-break:break-all}small{color:#666}</style></head><body>
<h2>🔒 암호 해시 만들기</h2>
<p><small>이 화면은 내 브라우저 안에서만 계산하며 암호를 어디에도 전송하지 않습니다. 만든 두 줄을 <b>mrkim-gate.js</b> 맨 위의 USER_HASH / ADMIN_HASH 값으로 붙여넣으세요. 설정 후에는 이 파일을 서버에 올리지 않는 것이 좋습니다.</small></p>
<label>이용 암호 (페이지 이동 시 입력)</label><input id="u" type="text" autocomplete="off">
<label>관리자 암호 (입력하면 잠금 기능이 꺼짐)</label><input id="a" type="text" autocomplete="off">
<button id="go">해시 만들기</button><pre id="out"></pre>
<script>
async function h(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mk|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
document.getElementById('go').onclick=async()=>{const u=document.getElementById('u').value,a=document.getElementById('a').value;if(!u||!a){out.textContent='두 암호를 모두 입력해 주세요.';return}if(u===a){out.textContent='이용 암호와 관리자 암호는 서로 달라야 합니다.';return}
out.textContent="var USER_HASH  = '"+await h(u)+"';\nvar ADMIN_HASH = '"+await h(a)+"';"};
</script></body></html>
